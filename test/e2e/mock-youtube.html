<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <!-- YouTube enforces Trusted Types; reproduce that so any innerHTML use would throw. -->
        <meta http-equiv="Content-Security-Policy" content="require-trusted-types-for 'script'" />
        <title>Mock YouTube player</title>
        <link rel="icon" href="data:," />
        <link rel="stylesheet" href="../../src/shared/slider.css" />
        <style>
            body {
                margin: 0;
                background: #0f0f0f;
                font-family: Roboto, Arial, sans-serif;
            }
            .html5-video-player {
                position: relative;
                width: 960px;
                height: 540px;
                background: #000;
                margin: 20px;
            }
            video {
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #243b55, #141e30);
            }
            .ytp-chrome-bottom {
                position: absolute;
                left: 12px;
                right: 12px;
                bottom: 0;
                height: 48px;
            }
            .ytp-chrome-controls {
                height: 48px;
            }
            .ytp-left-controls {
                display: flex;
                height: 100%;
            }
            .ytp-button {
                width: 48px;
                height: 48px;
                background: none;
                border: 0;
                color: #fff;
                padding: 0;
            }
            .ytp-volume-area {
                display: inline-block;
                height: 100%;
            }
            .ytp-volume-panel {
                display: inline-block;
                width: 52px;
                height: 100%;
                background: rgba(255, 0, 0, 0.4);
            }
            .ytp-time-display {
                color: #ddd;
                line-height: 48px;
                font-size: 13px;
                padding-left: 8px;
            }
        </style>
    </head>
    <body>
        <div id="movie_player" class="html5-video-player" tabindex="-1">
            <video></video>
            <div class="ytp-chrome-bottom">
                <div class="ytp-chrome-controls">
                    <div class="ytp-left-controls">
                        <button class="ytp-play-button ytp-button">▶</button>
                        <span class="ytp-volume-area">
                            <button class="ytp-mute-button ytp-button" id="mute">🔊</button>
                            <div class="ytp-volume-panel"></div>
                        </span>
                        <div class="ytp-time-display">1:23 / 4:56</div>
                    </div>
                </div>
            </div>
        </div>
        <script src="mock-player.js"></script>
        <script src="../../src/shared/settings.js"></script>
        <script src="mock-bridge.js"></script>
        <script src="../../src/shared/curves.js"></script>
        <script src="../../src/shared/format.js"></script>
        <script src="../../src/shared/slider.js"></script>
        <script src="../../src/content/gain.js"></script>
        <script src="../../src/content/main.js"></script>
    </body>
</html>
